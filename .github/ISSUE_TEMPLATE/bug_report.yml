name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS Version
      options:
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - macOS 12 (Monterey)
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Meeting Helper Version
      description: "Check in the app menu: Meeting Helper > About"
      placeholder: e.g. 1.0.17
    validations:
      required: true

  - type: input
    id: ollama-model
    attributes:
      label: Ollama Model Used
      placeholder: e.g. gemma4:e4b, llama3.2, qwen3
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: "Run `node --version` in your terminal"
      placeholder: e.g. v22.0.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant terminal output from `pnpm dev`.
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
    validations:
      required: false
